<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статья — GovnoLab</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="header">
  <div class="container nav">
    <a href="index.html" class="logo"><span class="logo-mark">G</span> GovnoLab</a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.home">Главная</a></li>
      <li><a href="services.html" data-i18n="nav.services">Услуги</a></li>
      <li><a href="cases.html" data-i18n="nav.cases">Кейсы</a></li>
      <li><a href="blog.html" data-i18n="nav.blog">Блог</a></li>
      <li><a href="about.html" data-i18n="nav.about">О нас</a></li>
    </ul>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Язык" data-i18n-aria-label="nav.lang">
        <button type="button" data-lang="ru">RU</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a href="about.html#contact" class="btn btn-primary btn-sm" data-i18n="nav.cta">Оставить заявку</a>
      <button class="burger" aria-label="Меню" data-i18n-aria-label="nav.menu">☰</button>
    </div>
  </div>
</header>

<section class="section">
  <div class="container">
    <article class="article" id="article">
      <p class="muted">…</p>
    </article>
  </div>
</section>

<section class="section soft">
  <div class="container">
    <h2 data-i18n="article.related">Читайте также</h2>
    <div class="grid grid-3" id="related"></div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-grid">
    <div>© <span data-year></span> <span data-i18n="footer.copy">GovnoLab — маркетинговое агентство. Данные на сайте демонстрационные.</span></div>
    <ul>
      <li><a href="services.html" data-i18n="footer.services">Услуги</a></li>
      <li><a href="cases.html" data-i18n="footer.cases">Кейсы</a></li>
      <li><a href="blog.html" data-i18n="footer.blog">Блог</a></li>
      <li><a href="about.html#contact" data-i18n="footer.contacts">Контакты</a></li>
    </ul>
  </div>
</footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/main.js"></script>
<script>
  (function () {
    const id = new URLSearchParams(location.search).get("id");
    const post = SITE_DATA.posts.find((p) => p.id === id);
    const box = document.getElementById("article");
    const related = document.getElementById("related");
    const L = I18N.L, t = I18N.t;
    const fmtDate = (d) => new Date(d).toLocaleDateString(I18N.locale(), { day: "numeric", month: "long", year: "numeric" });

    function render() {
      if (!post) {
        document.title = t("js.notfound") + " — GovnoLab";
        box.innerHTML = `<h1>${t("js.notfound")}</h1><p class="muted">${t("js.notfound.text")}</p><a href="blog.html" class="btn btn-ghost">${t("js.toblog")}</a>`;
      } else {
        document.title = L(post.title) + " — GovnoLab";
        box.innerHTML = `
          <a href="blog.html" class="link" style="color:var(--accent);font-weight:600">${t("js.allposts")}</a>
          <div class="post-meta" style="margin-top:20px"><span class="tag">${L(post.category)}</span> ${fmtDate(post.date)} · ${post.readTime} ${t("js.readtime")}</div>
          <h1>${L(post.title)}</h1>
          <p class="muted" style="font-size:1.15rem">${L(post.excerpt)}</p>
          <div class="body">${L(post.body)}</div>
          <div class="cta" style="margin-top:40px;padding:36px 24px">
            <h2 style="font-size:1.5rem">${t("js.help.title")}</h2>
            <p>${t("js.help.text")}</p>
            <a href="about.html#contact" class="btn btn-primary">${t("js.help.btn")}</a>
          </div>`;
      }
      related.innerHTML = "";
      SITE_DATA.posts.filter((p) => p.id !== id).slice(0, 3).forEach((p) => {
        const el = document.createElement("a");
        el.className = "card";
        el.href = "article.html?id=" + p.id;
        el.innerHTML = `<div class="post-meta"><span class="tag">${L(p.category)}</span> ${p.readTime} ${t("js.min")}</div><h3>${L(p.title)}</h3><p>${L(p.excerpt)}</p><span class="link">${t("js.readmore")}</span>`;
        related.appendChild(el);
      });
    }
    document.addEventListener("langchange", render);
    render();
  })();
</script>
</body>
</html>
