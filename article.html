<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — GovnoLab</title>
  <meta name="theme-color" content="#07090f">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=9">
</head>
<body>
<header class="header">
  <div class="container nav">
    <a href="index.html" class="logo"><span class="logo-mark">G</span> GovnoLab</a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.home">Home</a></li>
      <li><a href="services.html" data-i18n="nav.services">Services</a></li>
      <li><a href="cases.html" data-i18n="nav.cases">Case studies</a></li>
      <li><a href="blog.html" data-i18n="nav.blog">Blog</a></li>
      <li><a href="about.html" data-i18n="nav.about">About</a></li>
    </ul>
    <div class="nav-right">
      <div class="lang" role="group" aria-label="Language" data-i18n-aria-label="nav.lang">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ru">RU</button>
      </div>
      <a href="about.html#contact" class="btn btn-primary btn-sm"><span data-i18n="nav.cta">Get in touch</span><span data-icon="arrow-up-right"></span></a>
      <button class="burger" aria-label="Menu" data-i18n-aria-label="nav.menu"><span data-icon="menu"></span></button>
    </div>
  </div>
</header>

<section class="section">
  <div class="container">
    <article class="article" id="article">
      <p class="muted">…</p>
    </article>
  </div>
</section>

<section class="section soft">
  <div class="container">
    <h2 data-i18n="article.related">Read next</h2>
    <div class="grid grid-3" id="related"></div>
  </div>
</section>

<footer class="footer">
  <div class="container footer-grid">
    <div>© <span data-year></span> <span data-i18n="footer.copy">GovnoLab — performance marketing agency. All figures on this site are for demonstration purposes.</span></div>
    <ul>
      <li><a href="services.html" data-i18n="footer.services">Services</a></li>
      <li><a href="cases.html" data-i18n="footer.cases">Case studies</a></li>
      <li><a href="blog.html" data-i18n="footer.blog">Blog</a></li>
      <li><a href="about.html#contact" data-i18n="footer.contacts">Contact</a></li>
    </ul>
  </div>
</footer>
<script src="assets/js/backdrop.js?v=9"></script>
<script src="assets/js/icons.js?v=9"></script>
<script src="assets/js/data.js?v=9"></script>
<script src="assets/js/i18n.js?v=9"></script>
<script src="assets/js/main.js?v=9"></script>
<script>
  (function () {
    const id = new URLSearchParams(location.search).get("id");
    const post = SITE_DATA.posts.find((p) => p.id === id);
    const box = document.getElementById("article");
    const related = document.getElementById("related");
    const CAT_ICON = { Analytics: "chart-column", Content: "pen-line", Ads: "megaphone", SEO: "search", CRM: "users" };
    const catIcon = (p) => ICONS.svg(CAT_ICON[p.category.en] || "tag");
    const L = I18N.L, t = I18N.t;
    const fmtDate = (d) => new Date(d).toLocaleDateString(I18N.locale(), { day: "numeric", month: "long", year: "numeric" });

    function render() {
      if (!post) {
        document.title = t("js.notfound") + " — GovnoLab";
        box.innerHTML = `<h1>${t("js.notfound")}</h1><p class="muted">${t("js.notfound.text")}</p><a href="blog.html" class="btn btn-ghost">${ICONS.svg("arrow-left")}<span>${t("js.toblog")}</span></a>`;
      } else {
        document.title = L(post.title) + " — GovnoLab";
        box.innerHTML = `
          <a href="blog.html" class="link">${ICONS.svg("arrow-left")}<span>${t("js.allposts")}</span></a>
          <div class="post-meta" style="margin-top:20px"><span class="tag">${catIcon(post)}${L(post.category)}</span> ${fmtDate(post.date)} · ${post.readTime} ${t("js.readtime")}</div>
          <h1>${L(post.title)}</h1>
          <p class="muted" style="font-size:1.15rem">${L(post.excerpt)}</p>
          <div class="body">${L(post.body)}</div>
          <div class="cta" style="margin-top:40px;padding:36px 24px">
            <h2 style="font-size:1.5rem">${t("js.help.title")}</h2>
            <p>${t("js.help.text")}</p>
            <a href="about.html#contact" class="btn btn-primary"><span>${t("js.help.btn")}</span>${ICONS.svg("send")}</a>
          </div>`;
      }
      related.innerHTML = "";
      SITE_DATA.posts.filter((p) => p.id !== id).slice(0, 3).forEach((p) => {
        const el = document.createElement("a");
        el.className = "card";
        el.href = "article.html?id=" + p.id;
        el.innerHTML = `<div class="post-meta"><span class="tag">${catIcon(p)}${L(p.category)}</span> ${p.readTime} ${t("js.min")}</div><h3>${L(p.title)}</h3><p>${L(p.excerpt)}</p><span class="link"><span>${t("js.readmore")}</span>${ICONS.svg("arrow-right")}</span>`;
        related.appendChild(el);
      });
    }
    document.addEventListener("langchange", render);
    render();
  })();
</script>
</body>
</html>
